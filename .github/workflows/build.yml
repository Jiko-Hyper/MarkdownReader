name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: python -m pip install --upgrade pillow markdown-it-py
      - name: 单元测试与启动检查
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD"
          python -m unittest discover -s tests -t . -p 'test_*.py'
          python main.py --version
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 网页端脚本语法与回归
        run: |
          node --check webui/app.js
          node --test tests/editor.test.cjs tests/webui_find.test.cjs

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'      # 必须与随包运行时一致，prepare_runtime 会取它的 tkinter
      - name: 安装打包依赖
        run: python -m pip install --upgrade pillow
      - name: 准备 MinGW（编译 exe 外壳）
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          # choco 装好后当前会话 PATH 还没刷新
          "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: 打包
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/build_release.ps1
      - name: 上传发布包
        uses: softprops/action-gh-release@v2
        with:
          files: release/MarkdownReader-*-win64.zip
          generate_release_notes: true
